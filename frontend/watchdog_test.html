<!doctype html>
<meta charset="utf-8">
<title>Job stream test</title>
<p>
  <input id="jid" size="45" placeholder="paste job id here">
  <button onclick="go()">Connect</button>
</p>
<pre id="log"></pre>
<script>
const API = "https://narrativeguard-2.onrender.com";
function add(line) {
  log.textContent += new Date().toLocaleTimeString() + "  " + line + "\n";
}
function go() {
  const es = new EventSource(API + "/api/jobs/" + jid.value.trim() + "/stream");
  add("connected, waiting for events...");
  for (const t of ["stage", "result", "failed"]) {
    es.addEventListener(t, e => {
      add(t + "  " + e.data);
      if (t !== "stage") es.close();   // stop after the final event
    });
  }
  es.onerror = () => add("(connection problem or closed)");
}
</script>
