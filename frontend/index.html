<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NarrativeGuard</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    #status { font-size: 1.5rem; }
  </style>
</head>
<body>
  <div>
    <h1>NarrativeGuard</h1>
    <p id="status">Checking API...</p>
    <pre id="log"></pre>
  </div>
  <script>
    const es = new EventSource("https://narrativeguard-2.onrender.com/api/jobs/962609c5-7a73-4294-a65b-e63be067c89a/stream");
    for (const t of ["stage", "result", "failed"]) {
      es.addEventListener(t, e => {
        log.textContent += t + " " + e.data + "\n";
        if (t !== "stage") es.close();
      });
    }
  </script>
</body>
</html>
